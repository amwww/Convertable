<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Convertable</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
    <style>
        :root {
            color-scheme: dark light;
            --bg: #0f172a;
            --bg-elevated: #111827;
            --border-subtle: #1f2937;
            --accent: #38bdf8;
            --accent-soft: rgba(56, 189, 248, 0.1);
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
            background: radial-gradient(circle at top, #1f2933, #020617);
            color: var(--text-main);
        }

        #app {
            height: 100vh;
            max-width: 960px;
            margin: 0 auto;
            padding: 20px 24px 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;

            /* When macOS titleBarStyle is hiddenInset, the web contents extend
               into the titlebar area. Make the header the drag region and leave
               room for the traffic-light buttons. */
            -webkit-app-region: drag;
            padding-top: 10px;
            padding-left: 76px;
        }

        header button,
        header select,
        header input,
        header textarea,
        header a,
        nav.tabs,
        nav.tabs button {
            -webkit-app-region: no-drag;
        }

        header h1 {
            margin: 0;
            font-size: 18px;
            letter-spacing: 0.02em;
        }

        header span {
            font-size: 12px;
            color: var(--text-muted);
        }

        nav.tabs {
            display: inline-flex;
            border-radius: 999px;
            padding: 3px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(31, 41, 55, 0.9);
        }

        nav.tabs button {
            border: none;
            background: transparent;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            cursor: pointer;
            transition: background 120ms ease, color 120ms ease;
        }

        nav.tabs button.active {
            background: var(--accent-soft);
            color: var(--accent);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-radius: 18px;
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.96), rgba(3, 7, 18, 0.98));
            border: 1px solid rgba(15, 23, 42, 0.96);
            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(15, 23, 42, 0.9);
            padding: 14px 16px 12px;
            box-sizing: border-box;
        }

        .tab-panel {
            display: none;
            height: 100%;
        }

        .tab-panel.active {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #drop-zone {
            flex: 1;
            border-radius: 16px;
            border: 1px dashed rgba(55, 65, 81, 0.9);
            background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.09), rgba(15, 23, 42, 0.9));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            color: var(--text-muted);
            transition: border-color 120ms ease, background 120ms ease, transform 100ms ease;
        }

        #drop-zone.drag-over {
            border-color: var(--accent);
            background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), rgba(15, 23, 42, 0.95));
            transform: translateY(-1px);
        }

        #drop-zone h2 {
            margin: 0;
            font-size: 14px;
            color: var(--text-main);
        }

        #drop-zone p {
            margin: 0;
            font-size: 12px;
        }

        .file-list, .queue-list, .result-list {
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            background: rgba(15, 23, 42, 0.85);
            padding: 8px 10px;
            box-sizing: border-box;
            min-height: 80px;
            max-height: 220px;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .file-row, .queue-row, .result-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 12px;
            padding: 5px 8px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.9);
        }

        .result-row[draggable="true"] {
            cursor: grab;
        }

        .result-row[draggable="true"]:active {
            cursor: grabbing;
        }

        .convert-progress {
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            background: rgba(15, 23, 42, 0.85);
            padding: 10px 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .convert-progress__top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 12px;
        }

        .convert-progress__label {
            color: var(--text-main);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .convert-progress__pct {
            color: var(--text-muted);
            min-width: 56px;
            text-align: right;
        }

        .convert-progress__bar {
            position: relative;
            height: 10px;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(2, 6, 23, 0.7);
            border: 1px solid rgba(31, 41, 55, 0.9);
        }

        .convert-progress__fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: 0%;
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.8), rgba(34, 197, 94, 0.55));
        }

        .queue-row {
            position: relative;
            overflow: hidden;
        }

        .queue-progress {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.9;
            z-index: 0;
        }

        .queue-progress__fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.35), rgba(56, 189, 248, 0.12));
        }

        .queue-row.is-running {
            outline: 1px solid rgba(56, 189, 248, 0.35);
        }

        .queue-row > :not(.queue-progress) {
            position: relative;
            z-index: 1;
        }

        .file-row.selected {
            outline: 1px solid rgba(56, 189, 248, 0.7);
            background: rgba(56, 189, 248, 0.12);
        }

        .file-list.drag-over {
            outline: 1px dashed var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
        }

        .file-name, .queue-name, .result-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-size, .file-ext, .file-mime, .queue-status, .result-ext {
            color: var(--text-muted);
            min-width: 60px;
            text-align: right;
        }

        .file-mime {
            min-width: 160px;
            font-size: 11px;
        }

        .convert-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 8px;
        }

        select, button {
            font: inherit;
        }

        select {
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            padding: 4px 10px;
            background: rgba(15, 23, 42, 0.9);
            color: var(--text-main);
        }

        button.primary {
            border-radius: 999px;
            border: none;
            padding: 6px 16px;
            background: linear-gradient(135deg, #38bdf8, #22c55e);
            color: #020617;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.35);
            transition: transform 100ms ease, box-shadow 120ms ease, filter 120ms ease;
        }

        button.primary:hover {
            filter: brightness(1.05);
            box-shadow: 0 10px 26px rgba(56, 189, 248, 0.45);
            transform: translateY(-1px);
        }

        button.primary:active {
            transform: translateY(0);
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.9);
        }

        button.secondary {
            border-radius: 999px;
            border: 1px solid rgba(31, 41, 55, 0.9);
            padding: 6px 14px;
            background: rgba(15, 23, 42, 0.85);
            color: var(--text-main);
            cursor: pointer;
        }

        button.secondary:hover {
            border-color: rgba(56, 189, 248, 0.6);
        }

        button.small {
            padding: 4px 10px;
            font-size: 12px;
        }

        .hint {
            font-size: 11px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <div>
                <h1>Convertable</h1>
                <span>Drop files, pick a target, convert.</span>
            </div>
            <nav class="tabs" aria-label="Tabs">
                <button class="active" type="button" data-tab="convert">Convert</button>
                <button type="button" data-tab="queue">Queue</button>
                <button type="button" data-tab="result">Result</button>
            </nav>
        </header>

        <main>
            <section class="tab-panel active" id="tab-convert">
                <div id="drop-zone">
                    <h2>Drop files here</h2>
                    <p class="hint">Or drag from Finder into this window.</p>
                </div>

                <div class="file-list" id="file-list" aria-label="Dropped files"></div>

                <div class="convert-progress" id="convert-progress" hidden>
                    <div class="convert-progress__top">
                        <div class="convert-progress__label" id="convert-progress-label">Converting…</div>
                        <div class="convert-progress__pct" id="convert-progress-pct">0%</div>
                    </div>
                    <div class="convert-progress__bar" aria-label="Conversion progress">
                        <div class="convert-progress__fill" id="convert-progress-fill"></div>
                    </div>
                </div>

                <div class="convert-footer">
                    <div class="hint">Select a target extension, then Convert.</div>
                    <div style="display:flex; gap: 10px; align-items:center;">
                        <button class="secondary" id="pick-files-button" type="button">Choose Files…</button>
                        <button class="secondary small" id="dnd-debug-button" type="button" title="Show drag-and-drop debug overlay">DnD Debug</button>
                        <select id="target-ext-select" aria-label="Target extension">
                            <option value=".PNG">.PNG</option>
                            <option value=".JPEG">.JPEG</option>
                            <option value=".WEBP">.WEBP</option>
                            <option value=".MP3">.MP3</option>
                            <option value=".WAV">.WAV</option>
                            <option value=".M4A">.M4A</option>
                            <option value=".MP4">.MP4</option>
                            <option value=".MOV">.MOV</option>
                        </select>
                        <button class="primary" id="convert-button" type="button">Convert</button>
                    </div>
                </div>
            </section>

            <section class="tab-panel" id="tab-queue">
                <div class="queue-list" id="queue-list" aria-label="Queue"></div>
            </section>

            <section class="tab-panel" id="tab-result">
                <div class="result-list" id="result-list" aria-label="Results"></div>
            </section>
        </main>
    </div>

    <script type="module" src="./dist/index.js"></script>
</body>
</html>
